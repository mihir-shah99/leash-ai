[project]
name = "agentshield-api"
version = "0.1.0"
description = "AgentShield Control Plane API"
authors = [
    {name = "Mihir Shah",email = "mihir@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.5.1,<4.0.0)",
    "presidio-analyzer (>=2.2.362,<3.0.0)",
    "presidio-anonymizer (>=2.2.362,<3.0.0)",
    "spacy (>=3.8.14,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.15.15"
mypy = "^2.1.0"

