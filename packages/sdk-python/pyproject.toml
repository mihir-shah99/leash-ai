[project]
name = "agentshield"
version = "0.1.0"
description = "AgentShield SDK for Operational Determinism"
authors = [
    {name = "Mihir Shah",email = "mihir@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "presidio-analyzer (>=2.2.362,<3.0.0)",
    "presidio-anonymizer (>=2.2.362,<3.0.0)",
    "spacy (>=3.8.14,<4.0.0)",
    "click (>=8.4.1,<9.0.0)",
    "langchain-core (>=1.4.0,<2.0.0)"
]
[tool.poetry]
include = ["agentshield/policies/*.cedar"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.15.15"
mypy = "^2.1.0"

